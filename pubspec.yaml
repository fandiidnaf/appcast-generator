name: appcast_generator
description: Universal Appcast Studio - Author, validate, and inspect multi-platform Appcast XML feeds
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  path: ^1.9.1
  shared_preferences: ^2.5.2
  uuid: ^4.5.3
  web: ^1.1.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
